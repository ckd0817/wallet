server {
    listen 80;
    server_name 152.32.147.55;
    location /.well-known/acme-challenge/ { root /var/www/wallet-acme; }
    location / { return 404; }
}
server {
    listen 8443 ssl;
    server_name 152.32.147.55;
    ssl_certificate /etc/letsencrypt/live/152.32.147.55/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/152.32.147.55/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}
